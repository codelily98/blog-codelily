# Loaded before cloud-init defaults. Validate a separate admin login before use.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
PermitTunnel no
GatewayPorts no
AllowUsers ubuntu codelily-backup
